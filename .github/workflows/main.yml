name: Build ESP32 Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        
      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          
      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./output ./
          # Копируем загрузчик и таблицу разделов из ядра ESP32 в папку output
          CORE_PATH=$(arduino-cli config get directories.data)/packages/esp32/hardware/esp32/*/tools/partitions
          cp $CORE_PATH/bootloader_4MB.bin ./output/bootloader.bin
          cp $CORE_PATH/default.csv ./output/partitions.csv
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ./output/esp32-firmware.ino.bin
