name: Build ESP32 Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        
      - name: Install ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          
      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./output ./esp32-firmware.ino
          
      - name: Merge Firmware
        run: |
          pip install esptool
          esptool.py --chip esp32 merge_bin -o ./output/merged-firmware.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 ./output/esp32-firmware.ino.bootloader.bin \
            0x8000 ./output/esp32-firmware.ino.partitions.bin \
            0xe000 ./output/boot_app0.bin \
            0x10000 ./output/esp32-firmware.ino.bin
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ./output/merged-firmware.bin
