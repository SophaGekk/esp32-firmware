name: Build ESP32 Firmware

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        
      - name: Install ESP32 Core and Libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          # Устанавливаем библиотеку для MQTT
          arduino-cli lib install "PubSubClient"
          
      - name: Compile Sketch
        run: |
          # Указываем путь к папке со скетчем
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./output ./esp32-comforte-zone
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          # Arduino CLI называет файл по имени папки/скетча
          path: ./output/esp32-comforte-zone.ino.bin
